{% extends "base.html" %}
{% block title %}Minha conta · Então Ganhei{% endblock %}
{% block content %}
<h1>Minha conta</h1>
{% if notice %}<p class="card callout ok" role="status">{{ notice }}</p>{% endif %}

<section class="card">
  <h2>Dados</h2>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/conta" class="stack">
    <div class="row">
      <label>Nome <input name="name" value="{{ me.name }}" required maxlength="80"></label>
      <label>Usuário <input name="username" value="{{ me.username }}" required maxlength="40" autocapitalize="none" autocorrect="off"></label>
    </div>
    <div class="row">
      <label>Email <input type="email" name="email" value="{{ me.email or '' }}" placeholder="para recuperar a senha"></label>
      <label>WhatsApp <input name="phone" value="{{ me.phone or '' }}" placeholder="+55 11 91234-5678"></label>
    </div>
    <button class="btn primary">Salvar</button>
  </form>
</section>

<section class="card">
  <h2>Trocar senha</h2>
  {% if pw_error %}<p class="error" role="alert">{{ pw_error }}</p>{% endif %}
  <form method="post" action="/conta/senha" class="stack">
    <input type="hidden" name="username" value="{{ me.username }}" autocomplete="username">
    <label>Senha atual <input type="password" name="current" required autocomplete="current-password"></label>
    <div class="row">
      <label>Nova senha <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
      <label>Repita <input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
    </div>
    <button class="btn primary">Trocar senha</button>
  </form>
</section>

<form method="post" action="/sair" class="footer-actions"><button class="btn">Sair</button></form>
{% endblock %}

{% extends "base.html" %}
{% block title %}Entrar · Então Ganhei{% endblock %}
{% block content %}
<section class="login card">
  <img src="/static/icon.svg" alt="" width="64" height="64">
  <h1>Então Ganhei</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/entrar" class="stack left">
    <label>Usuário ou email
      <input name="login" value="{{ login or '' }}" required autocomplete="username" autocapitalize="none" autocorrect="off" autofocus>
    </label>
    <label>Senha
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn primary block">Entrar</button>
  </form>
  <p class="small"><a href="/esqueci">Esqueci minha senha</a></p>
</section>
{% endblock %}

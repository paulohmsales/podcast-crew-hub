{% extends "base.html" %}
{% block title %}Entrar · Então Ganhei{% endblock %}
{% block content %}
<section class="login card">
  <img src="{{ logo_url() }}" alt="" width="64" height="64" class="logo">
  <h1>Então Ganhei</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/entrar" class="stack left">
    <label>Email
      <input type="email" name="email" value="{{ email or '' }}" required autocomplete="username" autocapitalize="none" autocorrect="off" autofocus>
    </label>
    <label>Senha
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn primary block">Entrar</button>
  </form>
  <p class="muted small">Primeiro acesso? Use seu email e escolha uma senha (mínimo 8 caracteres). Ela vira a sua senha.</p>
</section>
{% endblock %}
